<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorcery_rebirth · Icon gallery</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e8;color:#26352f;font:15px system-ui,sans-serif}header{max-width:1200px;margin:auto;padding:44px 24px 20px}h1{font-size:clamp(30px,5vw,52px);letter-spacing:-2px;margin:0 0 12px}p{line-height:1.7;color:#59675f}a{color:#267b58}nav{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 12px}input,select{border:1px solid #c6d0c7;background:#fffdf8;border-radius:10px;padding:13px 16px;color:inherit;font:inherit}input{flex:1;min-width:200px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;max-width:1200px;margin:auto;padding:12px 24px 48px}.icon{display:flex;flex-direction:column;align-items:center;min-width:0;padding:12px 8px;background:#fffaf1;border:1px solid #e7e0d4;border-radius:14px;text-decoration:none;color:inherit;transition:transform .15s}.icon:hover{transform:translateY(-3px);background:#fff}.icon img{width:96px;height:96px;object-fit:contain}.icon span{font-size:12px;text-align:center;line-height:1.4;overflow-wrap:anywhere;margin:8px 0 2px}.icon small{font-size:10px;color:#7a827b}#count{font-size:13px}.empty{grid-column:1/-1;padding:40px;text-align:center}@media(prefers-color-scheme:dark){body{background:#17231f;color:#e7e9dd}p{color:#b5c3b8}input,select{background:#24362d;border-color:#526154}.icon{background:#223129;border-color:#3c4c3d}.icon:hover{background:#2c3e31}a{color:#9dd9af}}
</style>
<header><h1>Sorcery_rebirth</h1><p>Vivid colors. Paper layers. Familiar marks.<br>Search by app name or Android package. Select an icon to open its source artwork.</p><a href="https://github.com/4oOkSk/Sorcery_rebirth">Source &amp; APK releases ↗</a>
<nav><input id="search" type="search" placeholder="Search · 搜索 · 検索" aria-label="Search icons"><select id="collection" aria-label="Collection"><option value="rebirth">Rebirth</option><option value="original">Original Sorcery</option><option value="all">Everything</option></select><select id="region" aria-label="Region"><option value="all">All regions</option><option value="CN">China · 中国</option><option value="JP">Japan · 日本</option><option value="Global">Global</option></select></nav><div id="count" aria-live="polite"></div></header><main id="grid"></main>
<script>
const catalog=/*CATALOG*/[];
const search=document.querySelector('#search'),collection=document.querySelector('#collection'),region=document.querySelector('#region'),grid=document.querySelector('#grid');
function update(){const q=search.value.trim().toLocaleLowerCase(),c=collection.value,r=region.value;const filtered=catalog.filter(i=>(c==='all'||c==='rebirth'&&i.collection!=='original'||i.collection===c)&&(r==='all'||i.region===r)&&(!q||[i.label,i.id,...i.packages].join(' ').toLocaleLowerCase().includes(q)));document.querySelector('#count').textContent=`${filtered.length} icons`;const fragment=document.createDocumentFragment();for(const i of filtered){const a=document.createElement('a');a.className='icon';a.href=i.source;a.title=i.packages.join('\n')||i.label;const img=document.createElement('img');img.src=i.source;img.alt=i.label;img.loading='lazy';const label=document.createElement('span');label.textContent=i.label;const meta=document.createElement('small');meta.textContent=i.region+' · '+(i.collection==='original'?'Original':'Rebirth');a.append(img,label,meta);fragment.append(a)}grid.replaceChildren(fragment);if(!filtered.length){const p=document.createElement('p');p.className='empty';p.textContent='No matching icons';grid.append(p)}}search.addEventListener('input',update);collection.addEventListener('change',update);region.addEventListener('change',update);update();
</script>
</html>
